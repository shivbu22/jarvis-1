# Jarvis policy. This file, not the language model, decides what may run.
#
# Tier resolution is most-restrictive-first: a name in `deny` beats the same name
# in `confirm`, which beats `auto`. Entries may be exact names or globs. A tool
# matching nothing falls to `default_tier` -- keep that at `confirm`.
#
#   auto    - read-only. Runs immediately, no question asked.
#   confirm - has a side effect. Jarvis asks out loud and waits for a yes;
#             silence past confirm_timeout_seconds is a NO.
#   deny    - refused outright, and never offered to the model as callable.

version: 1

default_tier: confirm
ultimate_power: false

tiers:
  auto:
    # --- Media, Entertainment & Quick Actions ---
    - youtube_play # play videos or search YouTube
    - music_play # play music on Spotify, YouTube Music, or resume
    - media_control # play/pause, next, previous, stop, mute, volume
    - volume_control # set/adjust system volume
    - web_open # open popular websites (YouTube, Netflix, Spotify, GitHub, etc.)
    - whatsapp_send # send WhatsApp messages to contacts or numbers
    - system_quick_action # lock workstation, task manager, settings, explorer
    # --- Desktop, Apps & Browser Interaction ---
    - app_launch # launch user apps (Notepad, Chrome, VS Code, etc.)
    - desktop_hotkey # key shortcuts (Win+D, Alt+Tab, etc.)
    - desktop_screenshot # capture screen
    - desktop_window_control # minimize, focus, list windows
    - desktop_type_text # type text into active window
    - desktop_mouse_action # move/click mouse
    - browser_open # launch browser
    - browser_navigate # navigate to URL
    - browser_click # click web element
    - browser_type # type into web element
    - browser_scroll # scroll web page
    - browser_press_key # browser keystrokes
    - browser_screenshot
    - browser_close
    - camera_capture
    - camera_describe
    - screen_describe # capture and describe active desktop screen
    - screen_locate_element # visually locate UI element coordinates
    - screen_click_element # visually locate and click UI element
    - clipboard_write # copy text to clipboard
    # --- Ultimate Power & Superpower Tools (Safe Analysis & Mode Control) ---
    - ultimate_brain_reason
    - ultimate_power_mode
    # --- observation only: no writes, no side effects ---
    - system_info # host, cpu, memory, disk, local time
    - web_search # DuckDuckGo, no API key
    - web_news
    - get_weather # Open-Meteo, no API key
    - memory_remember # storing a note is additive, never destructive
    - memory_recall
    - memory_list
    - learn_custom_command
    - list_custom_commands
    - delete_custom_command
    - ask_user # asking a question changes nothing
    - fs_list
    - fs_read
    - clipboard_read
    - mail_list_unread # reading an inbox changes nothing
    - mail_read
    - calendar_list
    - audit_tail # what has Jarvis actually done?
    - browser_read # reading the open page changes nothing
    - browser_get_elements # inspect visible interactive elements
    - code_search # search codebase / files
    - task_plan_manage # manage autonomous task plans
    - web_scrape_page # read full webpage markdown
    - process_inspect # inspect active running processes
    - brain_vault_search # search Obsidian brain vault
    - brain_vault_read # read notes from Obsidian brain vault
    - brain_vault_note_write # write/update notes in Obsidian brain vault
    - brain_vault_lint # lint/audit Obsidian brain vault health
    - subagent_spawn # spawn isolated child sub-agent
    - subagent_batch_run # execute parallel multi-agent batch
    - subagent_list # list active & completed sub-agents
    - subagent_status # inspect sub-agent execution trace
    - subagent_abort # abort running sub-agent
    - speaker_list # list enrolled speaker voiceprints
    - speaker_identify # identify active speaker from audio
    - speaker_enroll # enroll / update speaker profile
    - self_heal_diagnose # comprehensive system health diagnostics
    - self_heal_repair # autonomous self-repair & remediation
    - self_heal_status # health telemetry and watchdog status
    # --- Autonomous Vertical Engines ---
    - fetch_market_data # Yahoo Finance public quotes & technical indicators
    - check_portfolio # paper portfolio balances, P&L, holdings
    - lead_search # DuckDuckGo B2B ICP discovery
    - lead_qualify # ICP qualification matrix scoring
    - lead_pipeline_list # query local lead CRM pipeline
    - daily_executive_briefing # morning briefing: vitals, markets, leads, schedule
    - log_execution # autonomous ReAct execution ledger write
    - load_history # retrieve execution patterns & lessons learned
    - learning_performance_analytics # aggregated success rates & tool rankings
    - strategy_recommend # optimal tool sequence & heuristics recommendations
    # --- Research & OSINT ---
    - whois_lookup # domain registrar & WHOIS data
    - dns_mx_check # mail exchange & DNS health
    - company_filings_search # public corporate regulatory filings
    - crypto_market_pulse # crypto tickers and volumes
    - news_rss_aggregate # multi-source RSS news aggregation
    - social_sentiment_scan # community sentiment scanner
    - hiring_signals_search # job posting growth signals
    # --- Advanced Finance ---
    - technical_indicators_calc # MACD & Bollinger Bands
    - candlestick_pattern_detect # Doji, Hammer, Engulfing
    - portfolio_risk_calc # VaR & Sharpe Ratio
    - portfolio_rebalance # allocation adjustments
    - company_fundamentals # market cap & fundamental ratios
    # --- Productivity & Document Analytics ---
    - document_extract_text # PDF, CSV, JSON extraction
    - data_validate_clean # dataset deduplication & cleaning
    # --- Intelligence & NLP ---
    - nlp_sentiment_analyze # lexical polarity & tone
    - nlp_extract_entities # entity extraction (money, emails, dates)
    - dataset_stats_analyze # mean, median, stdev, variance
    - anomaly_detect # Z-score statistical outlier detector
    - learning_analytics # autonomous ROI & scoreboard
    # --- Scheduler & Reminders ---
    - reminder_set # schedule one-shot reminders
    - cron_task_schedule # recurring cron tasks
    - scheduled_tasks_list # list active scheduled tasks
    - scheduled_task_cancel # cancel a scheduled task
    # --- User Profile & Preferences ---
    - profile_get # read user preferences
    - profile_set # update user preferences
    # --- Self-Evolution & Dynamic Skills ---
    - list_evolution_rules
    - record_learned_rule
    - trigger_daily_briefing
    - skill_create
    - delete_evolution_rule

  confirm:
    - ultimate_exec # unrestricted powershell/cmd execution requires confirmation by default
    - ultimate_system_control # process termination and service control
    - speaker_delete # delete speaker voiceprint
    - fs_write
    - fs_mkdir
    - fs_delete # deletion is never auto
    - file_patch # targeted code / text replacement
    - python_eval # evaluate python code
    - shell_run
    - mail_send # sending on the master's behalf is always confirmed
    - calendar_add
    - browser_eval_js
    - execute_trade # high-stakes financial paper trade execution
    - lead_outreach_draft # external outreach communication drafting
    - run_advisor_consensus # multi-agent consensus deliberation
    - document_generate_invoice # creates invoice document & ledger entry
    - expense_track # logs business expense into database
    - cron_task_schedule # registers recurring background task
    # External MCP tools inherit a tier; anything unlisted still needs a yes
    # because default_tier is confirm. These globs make the intent explicit.
    - "mcp__*"

  deny:
    # Registered on purpose (see tools/registry.py) so that an attempt is a
    # logged refusal rather than an unknown-tool error -- and so the handler is
    # never reachable even if this file were edited carelessly.
    - shell_run_admin
    - registry_write
    - disk_format
    # Irreversible on an external service: refuse rather than ask.
    - "mcp__*__drop_*"

# Scanned only over EXECUTION SURFACES -- the arguments of tools that can run
# something (shell, app launch, filesystem, browser, external MCP tools). A note
# or an email that merely contains the words is not blocked, because no
# interpreter ever sees those bytes. This is what defuses prompt injection from a
# web page: the injected command still has to get past this list to reach a shell.
dangerous_patterns:
  # PowerShell -EncodedCommand smuggles arbitrary code as base64 that no other
  # pattern can read. The lookbehind (not \b) matters: \b before a '-' never
  # matches, because '-' is a non-word character on both sides.
  - '(?i)(?<![\w-])-enc(?:odedcommand)?\b'
  - '(?i)\brm\s+-(?:[a-z]*r[a-z]*f|[a-z]*f[a-z]*r)\b' # rm -rf
  - '(?i)\brm\s+-[a-z]*r\b' # any recursive rm
  - '(?i)\b(?:mkfs|fdisk|diskpart)\b' # partition tables
  - '(?i)\bformat\s+[a-z]:' # format C:
  - '(?i)\bcipher\s+/w\b' # wipe free space
  - '(?i)\bvssadmin\s+delete\b' # delete shadow copies
  - '(?i)\bgit\s+push\b[^\n]*(?:--force\b|(?<![\w-])-f(?![\w-]))'
  - '(?i)\bgit\s+(?:reset\s+--hard|clean\s+-[a-z]*f|filter-branch)\b'
  - '(?i)\breg(?:\.exe)?\s+delete\b'
  - '(?i)\b(?:shutdown|reboot)\s+(?:/s|/r|-h|-r|now)\b'
  - '(?i)\b(?:stop|disable)-service\b'
  - '(?i)\bset-executionpolicy\b'
  - '(?i)\bremove-item\b[^\n]*-recurse[^\n]*-force'
  - '(?i)\bdel\s+/[sfq]\b'
  - ':\(\)\s*\{.*\}\s*;\s*:' # fork bomb
  # PowerShell -EncodedCommand carries arbitrary code as base64 that no pattern
  # below can ever read. Refused wherever it appears in an execution surface.
  - '(?i)\b-enc(?:odedcommand)?\b'

# Refused outright for any tool with an execution surface, whatever the master says
# yes to: the blast radius here is the operating system, not the master's files.
# These are NOT applied to pure reads -- refusing to read a file under AppData
# protects nothing and breaks ordinary work (it is where temp files live).
protected_paths:
  - 'C:\Windows'
  - 'C:\Program Files'
  - 'C:\Program Files (x86)'
  - 'C:\ProgramData'
  - 'C:\$Recycle.Bin'

# Key material and credentials. Reading these is not forbidden -- the master may
# legitimately ask -- but it is never automatic. Any tool touching these is forced
# to ask first, because a read can leave the machine (a cloud brain, an email).
# .env is listed deliberately: it holds SMTP passwords and API keys, and a prompt
# injection that reads it through an auto-tier tool would exfiltrate them without
# ever triggering a confirmation.
sensitive_paths:
  - ".env"
  - 'C:\Users\ahiva\.ssh'
  - 'C:\Users\ahiva\.aws'
  - 'C:\Users\ahiva\.gnupg'
  - 'C:\Users\ahiva\AppData\Roaming\Microsoft\Crypto'

# Where the file tools (fs_write, fs_mkdir, fs_delete) may write. Reads are
# unrestricted except for protected_paths. Omit this key to inherit the shell
# workdir_roots below.
file_write_roots:
  - 'C:\Users\ahiva\OneDrive\Desktop'
  - 'C:\Users\ahiva\Documents'
  - 'C:\Users\ahiva\Downloads'
  - "%TEMP%"

shell:
  enabled: true
  # Only these may be the FIRST token of a command, and each must be a real
  # executable found on PATH. Shell builtins (dir, echo, type, cd) are absent on
  # purpose: they can only run under `cmd /c`, which would add a parsing layer
  # that a crafted argument could escape. Use fs_list and fs_read instead.
  allowed_executables:
    - git
    - node
    - npm
    - npx
    - python
    - python3
    - uv
    - pip
    - pytest
    - ruff
    - where
    - whoami
    - hostname
    - tasklist
    - curl
    - ffmpeg
    - tree
    - findstr
  # A command's working directory must resolve inside one of these.
  workdir_roots:
    - 'C:\Users\ahiva\OneDrive\Desktop'
    - 'C:\Users\ahiva\Documents'
    - 'C:\Users\ahiva\Downloads'
    - "%TEMP%"
  timeout_seconds: 20
  max_output_chars: 8000
  # Chaining (&&, ;, |, >, &, ^) and variable expansion (%) are off. Chaining is
  # the single most common way a benign allow-listed command becomes an arbitrary
  # one; expansion is how an argument smuggles a second one past this list.
  allow_chained_commands: false
