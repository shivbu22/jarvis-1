# Tooling configuration only.
#
# Dependencies deliberately live in requirements*.txt, not in [project.dependencies].
# Reason: the voice stack needs torch 2.6.0 from the PyTorch cu124 index, and a
# single index cannot serve both that and PyPI cleanly. setup.ps1 installs in a
# fixed order (torch cu124 first, then requirements-voice.txt) so that the CUDA
# build is already satisfied before chatterbox-tts asks for its torch -- this
# avoids downloading a redundant 2.5 GB CPU wheel. Keeping one source of truth
# for deps therefore means requirements files, and this file stays tooling-only.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "mcp_servers", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line length is advisory; the formatter is authoritative
  "B008",   # FastAPI's Depends() in defaults is the documented pattern
  "RUF001", # en-dashes and curly quotes appear in prose strings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Test files may use long fixtures and nested with-blocks.
"tests/**" = ["SIM117"]
# Entry-point scripts put the project root on sys.path before importing the
# application, so their imports genuinely cannot all sit at the top of the file
# and are not in the order isort would choose. E402 and I001 are deliberate here.
"scripts/**" = ["E402", "I001"]
"mcp_servers/**" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "live: requires a running gateway on localhost:8000",
  "keys: requires a real provider API key; skipped when absent",
  "voice: requires the optional voice extra (torch + chatterbox + faster-whisper)",
  "slow: loads gigabytes of weights or runs minutes on CPU; opt-in via JARVIS_RUN_VOICE_TESTS",
]
filterwarnings = ["ignore::DeprecationWarning"]
